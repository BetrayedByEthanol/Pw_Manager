name: Vaulty V02 candidate format
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/v02/**'
      - 'src/lib.rs'
      - 'tools/v02_verifier/**'
      - 'docs/security/V02D-independent-review-handoff.md'
      - 'docs/security/V02F-recovery-assurance-and-cryptographic-policy.md'
      - 'docs/architecture/v02g-vnext-cryptographic-protocol-review.md'
      - 'docs/security/V02H-adversarial-conformance-and-review-submission.md'
      - 'docs/security/V02H-round-two-review-disposition.md'
      - 'docs/security/V02I-fido2-prf-isolation-and-hardware-assurance.md'
      - 'docs/security/V02J-isolated-fido2-hardware-verification.md'
      - 'docs/security/V02K-physical-fido2-verification-and-evidence.md'
      - 'tools/hardware/**'
      - 'docs/roadmap/acceptance-register.md'
      - 'docs/specification/v0.4.5.md'
      - 'docs/decisions/register.md'
      - 'tools/security_probes/CRYPTO_REVIEW_REQUEST.md'
      - '.github/workflows/v02-candidate.yml'
  push:
    branches: [main, feat/v02-canonical-format-foundation-v0]
    paths:
      - 'src/v02/**'
      - 'src/lib.rs'
      - 'tools/v02_verifier/**'
      - 'docs/security/V02D-independent-review-handoff.md'
      - 'docs/security/V02F-recovery-assurance-and-cryptographic-policy.md'
      - 'docs/architecture/v02g-vnext-cryptographic-protocol-review.md'
      - 'docs/security/V02H-adversarial-conformance-and-review-submission.md'
      - 'docs/security/V02H-round-two-review-disposition.md'
      - 'docs/security/V02I-fido2-prf-isolation-and-hardware-assurance.md'
      - 'docs/security/V02J-isolated-fido2-hardware-verification.md'
      - 'docs/security/V02K-physical-fido2-verification-and-evidence.md'
      - 'tools/hardware/**'
      - 'docs/roadmap/acceptance-register.md'
      - 'docs/specification/v0.4.5.md'
      - 'docs/decisions/register.md'
      - 'tools/security_probes/CRYPTO_REVIEW_REQUEST.md'
      - '.github/workflows/v02-candidate.yml'
permissions:
  contents: read
jobs:
  v02-only:
    runs-on: ubuntu-latest
    steps:
      # Review inventory must bind to the actual PR head, never an ephemeral
      # synthetic pull_request merge commit that external reviewers cannot pin.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: V02-H independent reference vectors, hostile routes and resource budgets
        run: |
          python3 tools/v02_verifier/reference_v02h.py --verify
          python3 -m unittest discover -s tools/v02_verifier -p 'test_v02h_adversarial.py' -v
      - name: Candidate format compilation and negative tests
        run: |
          cargo check --manifest-path tools/v02_verifier/Cargo.toml --locked --all-targets
          cargo test --manifest-path tools/v02_verifier/Cargo.toml --locked --all-targets
          cargo run --manifest-path tools/v02_verifier/Cargo.toml --locked --bin vaulty_v02k -- preflight
      - name: Cross-library V02-C synthetic vector conformance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium23 libargon2-1
          python3 tools/v02_verifier/reference_v02c.py --verify
      - name: V02-D reviewer source inventory and tamper tests
        run: |
          python3 -m unittest discover -s tools/v02_verifier -p 'test_review_bundle.py' -v
          python3 -m unittest discover -s tools/v02_verifier -p 'test_v02f_policy_contract.py' -v
          python3 -m unittest discover -s tools/v02_verifier -p 'test_v02_round2_register.py' -v
          python3 tools/v02_verifier/reference_v02i_prf.py --verify
          python3 -m unittest discover -s tools/v02_verifier -p 'test_v02i_policy_contract.py' -v
          python3 -m unittest discover -s tools/hardware -p 'test_*.py' -v
          python3 tools/hardware/fido2_v02j.py preflight
          python3 tools/v02_verifier/review_bundle.py --write /tmp/v02d-review-manifest.json
          python3 tools/v02_verifier/review_bundle.py --check /tmp/v02d-review-manifest.json
          sha256sum /tmp/v02d-review-manifest.json
      - name: Publish review inventory (NOT independent approval)
        uses: actions/upload-artifact@v4
        with:
          name: v02d-review-source-manifest
          path: /tmp/v02d-review-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: No real-credential executable enabled
        run: |
          grep -F 'ExitCode::FAILURE' src/main.rs
          ! grep -R -F 'dumpmasterkey' src/ --include='*.rs'
