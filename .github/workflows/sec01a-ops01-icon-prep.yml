# Temporary PR-only post-change browser/semgrep validation.
# Delete before merge; permanent GitHub static scans remain manual-only.
name: SEC-01A OPS-01 temporary browser and Semgrep verification
on:
  pull_request:
    paths:
      - 'extenstion/icons/**'
      - '.security/semgrep/vaulty-browser.yml'
      - 'tools/security/test_sec01a.py'
      - '.github/workflows/sec01a-ops01-icon-prep.yml'
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: SEC-01A regression tests
        run: python3 -B -m unittest discover -s tools/security -p 'test_*.py' -v
      - name: Run exact npm-locked Firefox lint and reject icon warning
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:firefox 2>&1 | tee "$RUNNER_TEMP/vaulty-web-ext.txt"
          if grep -q 'ICON_SIZE_INVALID' "$RUNNER_TEMP/vaulty-web-ext.txt"; then
            echo 'Unexpected icon-dimensions warning' >&2
            exit 1
          fi
          grep -q 'BACKGROUND_SERVICE_WORKER_IGNORED' "$RUNNER_TEMP/vaulty-web-ext.txt"
          grep -q 'MISSING_DATA_COLLECTION_PERMISSIONS' "$RUNNER_TEMP/vaulty-web-ext.txt"
      - name: Validate anchored paths with exact candidate Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --disable-pip-version-check --quiet 'semgrep==1.184.0'
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --validate --config .security/semgrep --metrics off
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config .security/semgrep --error --metrics off src extenstion tools 2>&1 | tee "$RUNNER_TEMP/vaulty-semgrep.txt"
          if grep -q 'will soon be interpreted' "$RUNNER_TEMP/vaulty-semgrep.txt"; then
            echo 'Unresolved Semgrepignore-v2 path warning' >&2
            exit 1
          fi
