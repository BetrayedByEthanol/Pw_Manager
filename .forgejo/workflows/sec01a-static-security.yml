name: SEC-01A static security (candidate — runner required)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  static-security:
    # The label must be registered on an isolated, ephemeral Forgejo runner.
    # Runner label selects a verified digest-pinned OCI image; do NOT fall back
    # to the generic homelab 'docker' label or mount the host engine socket.
    runs-on: vaulty-pr
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: SEC-00 and SEC-01A contracts
        run: bash scripts/security/run.sh contract
      - name: Verify installed candidate tool versions
        run: python3 scripts/security/check-static-versions.py
      - name: Run actual candidate static security checks
        run: bash scripts/security/run.sh static-pr
