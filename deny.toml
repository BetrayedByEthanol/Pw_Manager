# SEC-01A. Run once per independent Rust manifest; this is not a Cargo workspace.
# Defaults deliberately retain advisory and source checks without broad exclusions.
[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "warn"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "warn"
unlicensed = "warn"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
